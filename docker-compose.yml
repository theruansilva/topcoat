services:
  postgres:
    image: postgres:16-alpine
    container_name: toasty_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toasty_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toasty_dev"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
